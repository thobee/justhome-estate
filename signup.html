<!doctype html>
<html lang="en">
  <head>
    <!-- head:start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/webp" href="images/opt/logo-96.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style/main.css" />
    <script>if(matchMedia("(prefers-reduced-motion: no-preference)").matches)document.documentElement.classList.add("js-motion")</script>
    <!-- head:end -->
    <title>Create an account – JustHome Real Estate</title>
    <meta name="description" content="Create a free JustHome account to save homes and book viewings." />
    <meta name="robots" content="noindex" />
  </head>
  <body class="bg-white">
    <a href="#main" class="sr-only z-[60] rounded-full bg-white px-4 py-3 text-sm font-semibold shadow-lift focus:not-sr-only focus:fixed focus:left-4 focus:top-4">Skip to content</a>
    <div class="grid min-h-[100svh] lg:grid-cols-2">
      <aside class="relative isolate hidden overflow-hidden bg-ink-950 lg:block">
        <img src="images/opt/interior-1200.webp" srcset="images/opt/interior-800.webp 800w, images/opt/interior-1200.webp 1200w" sizes="50vw" width="1200" height="1800" alt="" class="absolute inset-0 -z-10 h-full w-full object-cover" />
        <div class="absolute inset-0 -z-10 bg-gradient-to-t from-ink-950/85 via-ink-950/25 to-transparent" aria-hidden="true"></div>
        <div class="flex h-full flex-col justify-end p-12 text-white">
          <h2 class="max-w-md text-4xl font-bold leading-tight text-white">Join our community of property seekers</h2>
          <p class="mt-4 max-w-md text-lg leading-relaxed text-white/80">Save homes you love and book viewings from one account.</p>
        </div>
      </aside>

      <main id="main" class="flex flex-col px-4 py-6 sm:px-8">
        <nav class="flex items-center justify-between" aria-label="Site">
          <a href="index.html" class="-ml-2 flex min-h-[44px] items-center gap-2.5 rounded-full px-2" aria-label="JustHome, home">
            <img src="images/opt/logo-96.webp" width="38" height="28" alt="" class="h-7 w-auto" />
            <span class="text-lg font-extrabold tracking-tight">Just<span class="text-brand-700">Home</span></span>
          </a>
          <a href="index.html" class="icon-btn" aria-label="Close and go to the homepage"><i class="fas fa-xmark text-lg" aria-hidden="true"></i></a>
        </nav>

        <div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center py-10">
          <h1 class="hero-in text-3xl font-extrabold sm:text-4xl">Create an account</h1>
          <p class="hero-in mt-2 text-ink-600" style="--d: 60ms">Join our community of property seekers.</p>

          <div id="signup-error" class="mt-6 flex items-start gap-3 rounded-2xl bg-red-50 p-4 text-sm font-medium text-red-800 ring-1 ring-inset ring-red-200" role="alert" tabindex="-1" hidden>
            <i class="fas fa-circle-exclamation mt-0.5" aria-hidden="true"></i><span></span>
          </div>

          <form id="signup-form" class="hero-in mt-8 space-y-5" style="--d: 120ms" data-validate novalidate>
            <div>
              <label for="name" class="field-label">Full name</label>
              <input id="name" type="text" name="name" autocomplete="name" required data-label="Full name" class="field" />
            </div>
            <div>
              <label for="email" class="field-label">Email address</label>
              <input id="email" type="email" name="email" autocomplete="email" inputmode="email" spellcheck="false" required data-label="Email address" class="field" placeholder="name@example.com" />
            </div>
            <div>
              <label for="password" class="field-label">Password</label>
              <div class="relative" data-field>
                <input id="password" type="password" name="password" autocomplete="new-password" required minlength="6" data-label="Password" data-strength-input aria-describedby="password-strength-text" class="field pr-12" />
                <button type="button" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center rounded-r-xl text-ink-500 hover:text-ink-900" onclick="togglePassword(this)" aria-label="Show password" aria-pressed="false">
                  <i class="fas fa-eye" aria-hidden="true"></i>
                </button>
              </div>
              <div class="mt-3 flex gap-1.5" aria-hidden="true">
                <div class="password-strength h-1.5 flex-1 rounded-full bg-ink-200"></div>
                <div class="password-strength h-1.5 flex-1 rounded-full bg-ink-200"></div>
                <div class="password-strength h-1.5 flex-1 rounded-full bg-ink-200"></div>
                <div class="password-strength h-1.5 flex-1 rounded-full bg-ink-200"></div>
              </div>
              <p id="password-strength-text" class="mt-2 text-xs text-ink-500" aria-live="polite">Use 8+ characters with a number and a symbol.</p>
            </div>
            <div>
              <div class="flex items-start gap-3" data-field>
                <input id="terms" name="terms" type="checkbox" required class="mt-0.5 h-5 w-5 shrink-0 cursor-pointer rounded accent-brand-700" />
                <label for="terms" class="cursor-pointer text-sm text-ink-600">I agree to the Terms of Service and Privacy Policy.</label>
              </div>
            </div>
            <button type="submit" class="btn-primary min-h-[52px] w-full text-base">
              <span class="inline-flex items-center gap-2">Create account<i class="fas fa-arrow-right text-xs" aria-hidden="true"></i></span>
            </button>
          </form>

          <p class="mt-8 text-center text-ink-600">
            Already have an account?
            <a href="signin.html" class="inline-flex min-h-[44px] items-center font-semibold text-brand-700 hover:text-brand-800">Sign in</a>
          </p>
        </div>
      </main>
    </div>

    <script src="js/ui.js" defer></script>
    <script src="js/auth-forms.js" defer></script>
    <script src="js/signup.js" type="module"></script>
  </body>
</html>
